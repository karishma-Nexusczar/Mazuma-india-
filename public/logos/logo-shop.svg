<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Gold Scalloped Badge Base -->
  <g fill="#D4AF37">
    <circle cx="60" cy="60" r="56" />
  </g>
  <!-- White Inner Ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="60" cy="60" r="34" fill="#D4AF37" stroke="#FFFFFF" stroke-width="2" />

  <!-- Center Store Icon -->
  <!-- Store Awning -->
  <path d="M 44 48 L 76 48 L 76 52 Q 72 55, 68 52 Q 64 55, 60 52 Q 56 55, 52 52 Q 48 55, 44 52 Z" fill="#FFFFFF" />
  <!-- Store Building -->
  <rect x="46" y="52" width="28" height="18" fill="none" stroke="#FFFFFF" stroke-width="2" rx="1" />
  <!-- OPEN sign box -->
  <rect x="49" y="56" width="12" height="9" fill="none" stroke="#FFFFFF" stroke-width="1.2" rx="1" />
  <text x="55" y="63" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="4.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">OPEN</text>
  <!-- Door -->
  <rect x="64" y="57" width="7" height="13" fill="none" stroke="#FFFFFF" stroke-width="1.2" />

  <!-- Arc Text Top & Bottom -->
  <path id="shopTopArc" d="M 18,60 A 42,42 0 0,1 102,60" fill="none" />
  <path id="shopBottomArc" d="M 102,60 A 42,42 0 0,1 18,60" fill="none" />
  
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
    <textPath href="#shopTopArc" startOffset="50%" text-anchor="middle">SHOP &amp; ESTABLISHMENT</textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="900" fill="#FFFFFF" letter-spacing="1">
    <textPath href="#shopBottomArc" startOffset="50%" text-anchor="middle">★ REGISTRATION ★</textPath>
  </text>
</svg>
