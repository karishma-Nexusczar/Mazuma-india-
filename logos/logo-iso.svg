<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Outer Navy Circle Seal -->
  <circle cx="60" cy="60" r="56" fill="#12284C" stroke="#081B37" stroke-width="2" />
  <circle cx="60" cy="60" r="50" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="60" cy="60" r="44" fill="none" stroke="#FFFFFF" stroke-width="1" />

  <!-- Center Banner / ISO Text -->
  <text x="60" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ISO</text>
  
  <!-- Arc Text Top & Bottom -->
  <path id="topArc" d="M 24,60 A 36,36 0 0,1 96,60" fill="none" />
  <path id="bottomArc" d="M 96,60 A 36,36 0 0,1 24,60" fill="none" />
  
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">CERTIFIED</textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">COMPANY</textPath>
  </text>
</svg>
